services:
  whaleyeah:
    build:
      context: .
      dockerfile: Dockerfile
    image: cyber-whaleyeah:local
    user: "${MYUID:-1000}:${MYGID:-1000}"
    restart: unless-stopped
    ports:
      - "127.0.0.1:10000:10000"
    volumes:
      - ./etc/config.json:/config.json:ro
    depends_on:
      whaleyeah-mongodb:
        condition: service_healthy
        restart: true
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

  whaleyeah-mongodb:
    image: mongodb/mongodb-community-server:8.0-ubi8
    user: "${MYUID:-1000}:${MYGID:-1000}"
    restart: unless-stopped
    command: mongod --config /etc/mongod.conf
    volumes:
      - ./etc/mongod.conf:/etc/mongod.conf:ro
      - ./database:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --host
        - 127.0.0.1
        - --eval
        - 'quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
