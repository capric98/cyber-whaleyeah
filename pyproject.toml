[project]
name = "cyber-whaleyeah"
version = "0.1.0"
description = "Yet another Telegram bot"
requires-python = ">=3.14,<3.15"
dependencies = [
    "APScheduler~=3.11.3",
    "google-genai==3.3.0",
    "humanfriendly~=10.0",
    "ijson~=3.6.0",
    "inflection~=0.5.1",
    "jieba~=0.42.1",
    "motor~=3.7.1",
    "openai~=3.50.0",
    "python-telegram-bot~=22.8",
    "six~=1.17.0",
    "telegramify-markdown~=1.4.2",
    "tornado~=6.6.1",
    "urllib3~=2.8.0",
    "httpx~=0.28.1",
    "httpx2~=2.16.0",
]

[tool.uv]
package = false
prerelease = "disallow"
# Keep transitive upgrades within the tested major or pre-1.0 minor series.
constraint-dependencies = [
    "annotated-types<0.8",
    "cryptography<50",
    "jiter<0.17",
    "pyromark<0.11",
    "websockets<17",
]
